name: Account security regression tests
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'sql/account_history.sql'
      - 'sql/admin_update_user_null_guard.sql'
      - 'tests/security/**'
      - 'tests/account_history.test.cjs'
      - 'tests/invite_user_audit_test.cjs'
      - 'account_history.js'
      - 'supabase/functions/invite-user/index.ts'
      - '.github/workflows/account-security-tests.yml'
permissions:
  contents: read
jobs:
  isolated-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated database test runtime
        run: npm ci --ignore-scripts --prefix tests/security
      - name: Isolated PostgreSQL role and audit tests
        run: |
          node tests/security/admin_update_user.mjs
          node tests/security/account_audit.mjs
      - name: Install UI test dependencies
        run: npm ci --ignore-scripts
      - name: Account history UI and invitation mocks (no email)
        run: |
          node --test tests/account_history.test.cjs
          node tests/invite_user_audit_test.cjs
