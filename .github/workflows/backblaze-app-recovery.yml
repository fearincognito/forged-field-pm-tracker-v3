name: Local application recovery test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/backblaze-app-recovery.yml'
      - 'scripts/app_recovery_test.py'
      - 'scripts/recovery_browser_test.cjs'
permissions:
  contents: read
concurrency:
  group: local-application-recovery
  cancel-in-progress: true
jobs:
  local-app-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out recovery test code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install temporary browser test dependencies
        timeout-minutes: 5
        run: |
          npm install --prefix /tmp/recovery-browser --no-save --package-lock=false --ignore-scripts --no-audit --no-fund --fetch-retries=1 --fetch-timeout=30000 playwright@1.56.1
          node /tmp/recovery-browser/node_modules/playwright/cli.js install chromium
      - name: Restore and exercise isolated application
        env:
          B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
          RESTORE_APPLICATION_TEST: '1'
          NODE_PATH: /tmp/recovery-browser/node_modules
        run: python3 scripts/restore_backup_test.py
