name: Backblaze restore rehearsal
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/backblaze-restore-test.yml'
      - 'scripts/restore_backup_test.py'
permissions:
  contents: read
concurrency:
  group: backblaze-restore-rehearsal
  cancel-in-progress: false
jobs:
  restore-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out trusted test code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Download latest backup and restore in isolation
        env:
          B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
        run: python3 scripts/restore_backup_test.py
