name: Isolated managed recovery test
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hosted-recovery-test
  cancel-in-progress: false
jobs:
  recovery:
    if: github.ref == 'refs/heads/main'
    environment: recovery-test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out reviewed recovery code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Test target guards and sanitization
        run: python3 -m unittest discover -s tests -p test_hosted_recovery.py -v
      - name: Install temporary browser dependencies
        run: |
          npm install --prefix /tmp/recovery-browser --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.56.1
          node /tmp/recovery-browser/node_modules/playwright/cli.js install chromium
      - name: Restore sanitized backup into allowlisted empty recovery project
        env:
          NODE_PATH: /tmp/recovery-browser/node_modules
          B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
          RECOVERY_SUPABASE_DB_PASSWORD: ${{ secrets.RECOVERY_SUPABASE_DB_PASSWORD }}
          RECOVERY_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.RECOVERY_SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 scripts/hosted_recovery_test.py
