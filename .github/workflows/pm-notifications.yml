name: V3 PM service notifications
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Read-only check; do not send emails or pushes'
        type: boolean
        required: false
        default: false
permissions:
  contents: read
concurrency:
  group: v3-pm-notifications
  cancel-in-progress: false
jobs:
  deliver:
    if: ${{ vars.PM_ALERTS_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned provider clients
        run: python -m pip install 'psycopg[binary]==3.2.12' 'requests==2.32.5' 'pywebpush==2.2.0'
      - name: Read-only notification check
        if: ${{ inputs.dry_run == true }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python scripts/pm_notifications.py --dry-run
      - name: Check configuration and deliver alerts
        if: ${{ inputs.dry_run != true }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          PM_EMAIL_FROM: ${{ secrets.PM_EMAIL_FROM }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: python scripts/pm_notifications.py
